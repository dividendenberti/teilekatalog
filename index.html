<!DOCTYPE html>
<html lang="de">
<head>

<title>ProfiAuto Katalog – Test</title>

<body style="margin:0">
<div id="pak">
<style>
  #pak { --or:#d3302f; --rand:#e5e7eb; --grau:#6b7280; --ok:#15803d; --okbg:#dcfce7; --no:#b91c1c; --nobg:#fee2e2;

  #pak .pk-sorte > button:hover, #pak .pk-sorte.pk-offen > button { background:#fff3ea; }
  #pak .pk-sorte.pk-offen > button .pk-pfeil { transform:rotate(180deg); }
  #pak .pk-liter { display:flex; flex-wrap:wrap; gap:6px; padding:10px 16px 14px; border-top:1px solid var(--rand); }

  const BANNER_SEKUNDEN = 6;

  function reiter(name) {
    letzteAktion = null;
    [['fz', 'fzBtn'], ['oel', 'oelBtn'], ['uni', 'uniBtn']].forEach(([n, id]) => $id(id).classList.toggle('pk-akt', n === name));

    empfSichtbar();
  }
  let empf = null, empfLaedt = false;
  function empfSichtbar() {
    const sicht = !$id('start').hidden && !$id('out').innerHTML.trim() && !!(empf && empf.length);
    $id('empf').hidden = !sicht;
  }
  async function ladeEmpfehlungen() {

    catch (e) { empf = []; }
    finally { empfLaedt = false; empfSichtbar(); }
  }
  function zeigeEmpfehlungen() {

  async function hol(param) {
    let r;
    try { r = await fetch(API + '?' + new URLSearchParams(param), { headers: { [API_HEADER_NAME]: sitzung ? sitzung.headerauth : '' } }); }
    catch (x) { const e = new Error('Keine Verbindung zum Server (' + x.message + ')'); e.ausfall = true; e.server = true; throw e; }
    if (r.status === 401 || r.status === 403) { abmelden('Sitzung abgelaufen oder keine Berechtigung – bitte neu anmelden.'); throw new Error('Nicht angemeldet'); }
    if (!r.ok) { const e = new Error('Server antwortet mit HTTP ' + r.status); e.ausfall = r.status >= 500; throw e; }
    let j = await r.json(); if (Array.isArray(j)) j = j[0];
    if (!j.ok) { const e = new Error(j.fehler || 'Fehler'); if (AUSFALL.test(e.message)) e.ausfall = true; throw e; }
    anpassen(j);
    return j;
  }
  // Preis = EK × Aufschlag, Lagerort ausblenden – gilt für alle Antworten
  function anpassen(o) {
    if (Array.isArray(o)) { o.forEach(anpassen); return; }
    if (!o || typeof o !== 'object') return;
    if (typeof o.preisNetto === 'number' && !o.__angepasst) {
      o.preisNetto = Math.round(o.preisNetto * ((sitzung && sitzung.aufschlag) || 1) * 100) / 100;
      if (Array.isArray(o.preise)) o.preise = o.preise.filter((p) => p.typNr !== 5);
      o.__angepasst = true;
    }
    if (typeof o.verfuegbarkeit === 'string') o.verfuegbarkeit = ortWeg(o.verfuegbarkeit);
    for (const k in o) if (o[k] && typeof o[k] === 'object') anpassen(o[k]);
  }
  function ortWeg(s) {
    const t = String(s).replace(ORT_AUSBLENDEN, ' ').replace(/\s+/g, ' ').trim();
    const m = t.match(/^\((.*)\)$/); return m ? 'lagernd ' + m[1] : (t || s);
  }

      const r = await fetch(LOGIN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', [LOGIN_HEADER_NAME]: LOGIN_HEADER_WERT }, body: JSON.stringify({ benutzer, kennwort }) });
      if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? 'Login-Dienst verweigert den Zugriff (Header-Auth).' : 'Login-Dienst: HTTP ' + r.status);
      let j = await r.json(); while (Array.isArray(j)) j = j[0];
      if (!j || String(j.login).toLowerCase() !== 'erfolgreich' || !j.headerauth) throw new Error('Benutzer oder Kennwort falsch.');
      sitzung = { benutzer, headerauth: String(j.headerauth), aufschlag: Number(String(j.aufschlag ?? 1).replace(',', '.')) || 1 };
      try { sessionStorage.setItem('pk_sitzung', JSON.stringify(sitzung)); } catch (x) { /* egal */ }

  // Menge auf Set/Vielfaches aufrunden und Mindestmenge einhalten
  const mengeRunden = (m, schritt, mind) => { schritt = schritt || 1; m = Math.max(mind || 1, parseInt(m, 10) || 0); return Math.ceil(m / schritt) * schritt; };
  function inKorb(a, menge) {

          <td class="k-art"><div class="pk-nr">${esc(x.marke)} ${esc(x.artikelNr)}</div><div class="pk-sub">Händler-Nr. ${esc(x.haendlerArtNr)}</div>${x.fahrzeug ? `<div class="pk-sub">${esc(x.fahrzeug)}</div>` : ''}</td>
          <td class="pk-m k-bez">${esc(x.bezeichnung)}${x.setMenge ? `<div><span class="pk-hw pk-hw-set">Set ${x.setMenge} St.</span></div>` : ''}</td><td class="k-verf"><span class="pk-amp ${x.sofort ? 'ok' : 'no'}"><i></i>${esc(x.verfuegbarkeit)}</span></td>
          <td class="pk-num k-menge"><span class="pk-klbl">Menge</span><input class="pk-menge" type="number" min="${x.mindest || 1}" step="${x.schritt || 1}" value="${x.menge}" data-i="${i}">${(x.schritt || 1) > 1 ? `<div class="pk-sub">${x.menge / x.schritt} × ${x.schritt} St.</div>` : ''}</td>
          <td class="pk-num k-preis"><span class="pk-klbl">Preis / St.</span>${eur(x.preisNetto)}${x.pfandNetto ? `<div class="pk-sub pk-klbl" style="text-transform:none">+ Pfand ${eur(x.pfandNetto)}</div>` : ''}</td><td class="pk-num k-pfand">${x.pfandNetto ? eur(x.pfandNetto) : '–'}</td>
          <td class="pk-num k-summe"><span class="pk-klbl">Summe</span><b>${eur((x.preisNetto || 0) * x.menge + (x.pfandNetto || 0) * x.menge)}</b>${x.pfandNetto ? `<div class="pk-sub">inkl. Pfand ${eur(x.pfandNetto * x.menge)}</div>` : ''}</td>
          <td class="k-x"><button type="button" class="pk-x" data-del="${i}" aria-label="entfernen">×</button></td></tr>`).join('') +
        (pfandSumme ? `<tr class="pk-summe"><td colspan="7" class="pk-num pk-l">Warenwert netto</td><td class="pk-num pk-l">${eur(ware)}</td><td></td></tr>
          <tr class="pk-summe"><td colspan="7" class="pk-num pk-l">Pfand / Kaution netto (wird bei Rückgabe des Altteils gutgeschrieben)</td><td class="pk-num pk-l">${eur(pfandSumme)}</td><td></td></tr>` : '') +
        `<tr class="pk-summe"><td colspan="7" class="pk-num">Summe netto${pfandSumme ? ' inkl. Pfand' : ''}</td><td class="pk-num">${eur(summe)}</td><td></td></tr></tbody></table>
        <div class="pk-bestell"><label>Kommission / Bemerkung (optional)<input id="pk-bemerkung" maxlength="200" placeholder="z. B. Kennzeichen, Auftragsnummer …"></label>

      const z = (v) => { v = String(v ?? ''); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
      const k2 = (v) => (v == null ? '' : Number(v).toFixed(2).replace('.', ','));

        k2(x.preisNetto), k2(x.pfandNetto), k2((x.preisNetto || 0) * x.menge), k2((x.pfandNetto || 0) * x.menge), k2(((x.preisNetto || 0) + (x.pfandNetto || 0)) * x.menge), x.fahrzeug].map(z).join(';')));
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + zeilen.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
      a.download = 'warenkorb-profiauto.csv'; a.click();
    };
  }

  async function bestellen() {
    if (!korb.length) return;
    const r2 = (v) => Math.round((v || 0) * 100) / 100;
    const positionen = korb.map((x, i) => ({ pos: i + 1, haendlerArtNr: x.haendlerArtNr, marke: x.marke, artikelNr: x.artikelNr, bezeichnung: x.bezeichnung, menge: x.menge,
      setMenge: x.setMenge || null, preisNetto: x.preisNetto, pfandNetto: x.pfandNetto || 0, summeNetto: r2((x.preisNetto || 0) * x.menge), pfandSumme: r2((x.pfandNetto || 0) * x.menge),
      verfuegbarkeit: x.verfuegbarkeit, fahrzeug: x.fahrzeug || '' }));
    const ware = r2(positionen.reduce((s, x) => s + x.summeNetto, 0)), pfand = r2(positionen.reduce((s, x) => s + x.pfandSumme, 0));
    const daten = { benutzer: sitzung.benutzer, zeitpunkt: new Date().toISOString(), bemerkung: $id('bemerkung').value.trim(), aufschlag: sitzung.aufschlag,
      anzahlPositionen: positionen.length, warenwertNetto: ware, pfandNetto: pfand, summeNetto: r2(ware + pfand), positionen };
    if (!confirm(`Bestellung mit ${positionen.length} Position(en) über ${eur(daten.summeNetto)} netto senden?`)) return;
    const b = $id('bestellen'); b.disabled = true; b.textContent = 'Wird gesendet …';
    try {
      const r = await fetch(BESTELL_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', [API_HEADER_NAME]: sitzung.headerauth }, body: JSON.stringify(daten) });
      if (r.status === 401 || r.status === 403) throw new Error('Keine Berechtigung (HTTP ' + r.status + ')');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      let antwort = null; try { antwort = await r.json(); while (Array.isArray(antwort)) antwort = antwort[0]; } catch (x) { /* leere Antwort ist ok */ }
      if (antwort && (antwort.ok === false || /fehl/i.test(String(antwort.bestellung || antwort.status || '')))) throw new Error(antwort.fehler || antwort.meldung || 'Bestellung abgelehnt');
      korb = []; korbSpeichern();
      $id('out').innerHTML = `<div class="pk-leer-box" style="font-size:16px">✔ Bestellung gesendet – ${positionen.length} Position(en), ${eur(daten.summeNetto)} netto.${antwort && (antwort.bestellnummer || antwort.meldung) ? '<br>' + esc(antwort.bestellnummer ? 'Bestellnummer: ' + antwort.bestellnummer : antwort.meldung) : ''}</div>`;
      if (empf) zeigeEmpfehlungen();
      window.scrollTo(0, 0);
      setTimeout(() => { if (sitzung) { artDaten = null; fehler(); $id('out').innerHTML = ''; reiter('fz'); window.scrollTo({ top: 0, behavior: 'smooth' }); } }, 2000);
    } catch (e) { fehler(new Error('Bestellung nicht gesendet: ' + e.message)); b.disabled = false; b.textContent = '✔ Bestellung senden'; }
  }

  // ---------- Bestellhistorie (Flyover von rechts) ----------
  function flySchliessen() {
    const f = document.querySelector('#pak .pk-fly'), h = document.querySelector('#pak .pk-fly-hg');
    if (!f) return; f.classList.remove('pk-offen'); h.classList.remove('pk-offen');
    setTimeout(() => { f.remove(); h.remove(); }, 260);
  }
  async function zeigeHistorie() {
    $id('menue').hidden = true; flySchliessen();
    const hg = document.createElement('div'); hg.className = 'pk-fly-hg';
    const f = document.createElement('aside'); f.className = 'pk-fly'; f.setAttribute('role', 'dialog'); f.setAttribute('aria-label', 'Bestellhistorie');
    f.innerHTML = `<div class="pk-fly-kopf"><h2>📦 Bestellhistorie</h2><input type="search" placeholder="filtern …" aria-label="Historie filtern" hidden><button type="button" class="pk-fly-zu" aria-label="schließen">×</button></div>
      <div class="pk-fly-inhalt"><div class="pk-leer-box" style="margin-top:16px"><span class="pk-spin"></span>Lade Bestellungen …</div></div>`;
    $id('app').append(hg, f);
    requestAnimationFrame(() => { hg.classList.add('pk-offen'); f.classList.add('pk-offen'); });
    hg.onclick = flySchliessen; f.querySelector('.pk-fly-zu').onclick = flySchliessen;
    const inhalt = f.querySelector('.pk-fly-inhalt'), filter = f.querySelector('input');
    let zeilen = [];
    try {
      const r = await fetch(HISTORIE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', [API_HEADER_NAME]: sitzung.headerauth }, body: JSON.stringify({ benutzer: sitzung.benutzer }) });
      if (r.status === 401 || r.status === 403) throw new Error('Keine Berechtigung (HTTP ' + r.status + ')');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const t = await r.text(); let j = t ? JSON.parse(t) : [];
      if (!Array.isArray(j)) j = [j];
      zeilen = j.flat(3).filter((x) => x && typeof x === 'object' && (x.artikelnummer || x.bezeichnung));
    } catch (e) { inhalt.innerHTML = `<div class="pk-fehler" style="margin-top:16px">Bestellhistorie nicht geladen: ${esc(e.message)}</div>`; return; }
    if (!zeilen.length) { inhalt.innerHTML = '<div class="pk-leer-box" style="margin-top:16px">Noch keine Bestellungen.</div>'; return; }
    filter.hidden = false;
    const zahl = (v) => Number(String(v ?? 0).replace(',', '.')) || 0;
    const datum = (s) => { const d = new Date(s); return isNaN(d) ? String(s || '') : d.toLocaleString('de-AT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };
    function zeichnen() {
      const f2 = filter.value.trim().toLowerCase();
      const passt = (x) => !f2 || [x.artikelnummer, x.marke, x.bezeichnung, x.bemerkung].some((v) => String(v || '').toLowerCase().includes(f2));
      // Positionen mit gleichem Zeitpunkt = eine Bestellung, neueste zuerst
      const gruppen = new Map();
      for (const x of zeilen) { const k = x.createdAt || x.zeitpunkt || ''; if (!gruppen.has(k)) gruppen.set(k, []); gruppen.get(k).push(x); }
      const liste = [...gruppen.entries()].sort((a, b) => String(b[0]).localeCompare(String(a[0]))).map(([k, pos]) => [k, pos.filter(passt)]).filter(([, pos]) => pos.length);
      if (!liste.length) { inhalt.innerHTML = '<div class="pk-leer-box" style="margin-top:16px">Nichts gefunden.</div>'; return; }
      inhalt.innerHTML = liste.map(([k, pos]) => {
        const summe = pos.reduce((s, x) => s + (zahl(x.ek) + zahl(x.pfand)) * zahl(x.menge || 1), 0);
        const bem = [...new Set(gruppen.get(k).map((x) => String(x.bemerkung ?? '').trim()).filter(Boolean))].join(' · ');
        return `<div class="pk-hist-best"><div class="pk-hist-kopf"><b>${esc(datum(k))}</b><span>${pos.length} Position(en)</span><span class="pk-hist-sum">${eur(summe)}</span>${bem ? `<span class="pk-hist-bem">${esc(bem)}</span>` : ''}</div>
          <table><thead><tr><th>Artikel</th><th>Bezeichnung</th><th class="pk-num">Menge</th><th class="pk-num">Preis netto</th><th class="pk-num">Pfand</th><th class="pk-num">Summe</th></tr></thead><tbody>
          ${pos.map((x) => `<tr><td><div class="pk-sub">${esc(x.marke || '')}</div><button type="button" class="pk-hist-nr" data-nr="${esc(x.artikelnummer || '')}" title="Neue Suche nach ${esc(x.artikelnummer || '')}">${esc(x.artikelnummer || '–')}</button></td>
            <td>${esc(x.bezeichnung || '')}</td><td class="pk-num">${esc(x.menge ?? 1)}</td><td class="pk-num">${eur(zahl(x.ek))}</td><td class="pk-num">${zahl(x.pfand) ? eur(zahl(x.pfand)) : '–'}</td>
            <td class="pk-num"><b>${eur((zahl(x.ek) + zahl(x.pfand)) * zahl(x.menge || 1))}</b></td></tr>`).join('')}
          </tbody></table></div>`;
      }).join('');
      inhalt.querySelectorAll('.pk-hist-nr[data-nr]').forEach((b) => b.onclick = () => {
        if (!b.dataset.nr) return;
        flySchliessen(); $id('text').value = b.dataset.nr; suche(); window.scrollTo(0, 0);
      });
    }
    filter.oninput = zeichnen;
    zeichnen();
  }

        <div class="pk-ak-hnr">Händler-Nr. ${esc(a.haendlerArtNr)}</div>
        ${hinweise(a)}
        ${fz ? `<div class="pk-ak-fz">${esc(fz)}</div>` : ''}
        ${(a.montage || []).length ? `<div class="pk-ak-mont">${a.montage.map(esc).join(' · ')}</div>` : ''}
        ${par.length ? `<table class="pk-ak-par">${par.slice(0, PAR_MAX).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>` : ''}
        ${par.length > PAR_MAX ? `<button type="button" class="pk-ak-mehr" data-d="${i}">+ ${par.length - PAR_MAX} ${par.length - PAR_MAX === 1 ? 'weiteres Merkmal' : 'weitere Merkmale'}</button>` : ''}
      </div>
      <div class="pk-ak-rechts">
        <div class="pk-ak-preis"><small>€</small>${a.preisNetto == null ? '–' : Number(a.preisNetto).toFixed(2).replace('.', ',')}</div>
        <div>netto${a.pfandNetto ? ' · zzgl. Pfand ' + eur(a.pfandNetto) : ''}</div>
        <div class="pk-ak-verf ${a.sofortVerfuegbar ? 'ok' : 'no'}"><i></i>${esc(a.verfuegbarkeit)}</div>
        <div class="pk-ak-kauf"><input class="pk-menge" type="number" min="${a.mindestMenge || 1}" step="${a.mengeSchritt || 1}" value="${a.mindestMenge || 1}" aria-label="Menge"><button type="button" class="pk-add ${drin ? 'pk-drin' : ''}" data-a="${i}">🛒 In den Warenkorb</button></div>
        <button type="button" class="pk-ak-det" data-d="${i}">Details &amp; OE-Nummern</button>
      </div>
    </div>`;
  }
  function zeigeArtikel() {
    const alle = artDaten.artikel;
    const zaehl = {}; alle.forEach((a) => { zaehl[a.marke] = (zaehl[a.marke] || 0) + 1; });
    // Spezifikationen zählen (Schlüssel → häufigster Name)
    const spez = new Map();
    alle.forEach((a) => (a.spezifikationen || []).forEach((x) => { const e = spez.get(x.key) || { n: 0, namen: {} }; e.n++; e.namen[x.name] = (e.namen[x.name] || 0) + 1; spez.set(x.key, e); }));
    const spezName = (k) => { const e = spez.get(k); return e ? Object.entries(e.namen).sort((a, b) => b[1] - a[1])[0][0] : k; };
    const hatSpez = (a, k) => (a.spezifikationen || []).some((x) => x.key === k);
    let rows = alle.filter((a) => (!markenFilter.size || markenFilter.has(a.marke)) && (!nurLager || a.sofortVerfuegbar) && [...spezFilter].every((k) => hatSpez(a, k)));
    // Anzahl je Spezifikation innerhalb der aktuellen Auswahl (ohne Spezifikationsfilter selbst)
    const basis = alle.filter((a) => (!markenFilter.size || markenFilter.has(a.marke)) && (!nurLager || a.sofortVerfuegbar));
    const spezListe = [...spez.keys()].map((k) => ({ k, name: spezName(k), n: basis.filter((a) => hatSpez(a, k) && [...spezFilter].every((f) => f === k || hatSpez(a, f))).length }))
      .filter((x) => x.n || spezFilter.has(x.k)).sort((a, b) => (spezFilter.has(b.k) - spezFilter.has(a.k)) || (b.n - a.n) || a.name.localeCompare(b.name));
    const SPEZ_MAX = 24;
    bilder = [];
    const titel = artDaten.gruppe ? artDaten.gruppe.pfad.join(' / ') : artDaten.universal ? artDaten.universal.marke + ' / ' + artDaten.universal.gruppe : 'Suche „' + artDaten.suche + '“';
    $id('out').innerHTML = (artDaten.gruppe ? fzKarte() : '') + `<div class="pk-krumen">${zurueckZu ? `<button type="button" class="pk-btn2" id="pk-zurueck">← ${artDaten.gruppe ? 'Baugruppen' : 'zurück'}</button>` : ''}
        <b>${esc(titel)}</b><span class="pk-sub">${rows.length} von ${artDaten.gesamt} Artikeln${artDaten.gesamt > alle.length ? ' (die ' + alle.length + ' besten geladen)' : ''}</span></div>
      <div class="pk-leiste"><label style="margin-right:8px"><input type="checkbox" id="pk-lager" ${nurLager ? 'checked' : ''}> nur lagernd</label>
        <span class="pk-lbl">Hersteller:</span>${Object.entries(zaehl).sort((a, b) => a[0].localeCompare(b[0])).map(([m, n]) => `<button type="button" class="pk-chip ${markenFilter.has(m) ? 'pk-akt' : ''}" data-m="${esc(m)}">${esc(m)} (${n})</button>`).join('')}</div>` +
      (spezListe.length ? `<div class="pk-leiste"><span class="pk-lbl">Spezifikation:</span>${(spezAlle ? spezListe : spezListe.slice(0, SPEZ_MAX)).map((x) => `<button type="button" class="pk-chip pk-spez ${spezFilter.has(x.k) ? 'pk-akt' : ''}" data-s="${esc(x.k)}">${esc(x.name)} (${x.n})</button>`).join('')}
        ${spezListe.length > SPEZ_MAX ? `<button type="button" class="pk-chip" id="pk-spezmehr">${spezAlle ? 'weniger' : '+ ' + (spezListe.length - SPEZ_MAX) + ' weitere'}</button>` : ''}
        ${spezFilter.size ? '<button type="button" class="pk-chip" id="pk-spezweg">✕ Spezifikationen zurücksetzen</button>' : ''}</div>` : '') +
      (rows.length ? '<div class="pk-karten">' + rows.map(artikelKarte).join('') + '</div>'
      : '<div class="pk-leer-box">Keine Artikel für diese Auswahl.</div>');
    if ($id('zurueck')) $id('zurueck').onclick = () => zurueckZu && zurueckZu();
    $id('out').querySelectorAll('.pk-add[data-a]').forEach((b) => b.onclick = () => { inKorb(artDaten.artikel[+b.dataset.a], b.previousElementSibling.value); b.classList.add('pk-drin'); });
    $id('lager').onchange = (e) => { nurLager = e.target.checked; zeigeArtikel(); };
    $id('out').querySelectorAll('.pk-chip[data-m]').forEach((c) => c.onclick = () => { const m = c.dataset.m; markenFilter.has(m) ? markenFilter.delete(m) : markenFilter.add(m); zeigeArtikel(); });
    $id('out').querySelectorAll('.pk-chip[data-s]').forEach((c) => c.onclick = () => { const k = c.dataset.s; spezFilter.has(k) ? spezFilter.delete(k) : spezFilter.add(k); zeigeArtikel(); });
    if ($id('spezmehr')) $id('spezmehr').onclick = () => { spezAlle = !spezAlle; zeigeArtikel(); };
    if ($id('spezweg')) $id('spezweg').onclick = () => { spezFilter.clear(); zeigeArtikel(); };
    $id('out').querySelectorAll('.pk-pic[data-i]').forEach((b) => b.onclick = () => zeigeDetail(bilder[+b.dataset.i]));
    $id('out').querySelectorAll('.pk-nrlink[data-d], .pk-ak-det[data-d], .pk-ak-mehr[data-d]').forEach((b) => b.onclick = () => zeigeDetail(artDaten.artikel[+b.dataset.d]));
    $id('out').querySelectorAll('.pk-ak-kopie').forEach((b) => b.onclick = () => { try { navigator.clipboard.writeText(b.dataset.kopie); toast('Kopiert: ' + b.dataset.kopie); } catch (x) { /* egal */ } });
  }

  $id('marke').addEventListener('change', () => markeGewaehlt());
  $id('modell').addEventListener('change', () => modellGewaehlt());
  $id('typ').addEventListener('change', losPruefen);
  $id('los').addEventListener('click', typGewaehlt);
  $id('fzBtn').addEventListener('click', () => { if (fahrzeug && gruppen.length) zeigeGruppen(); else { reiter('fz'); fehler(); $id('out').innerHTML = ''; } });
  document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; const lb = document.querySelectorAll('#pak .pk-lb'); if (lb.length) lb.forEach((x) => x.remove()); else flySchliessen(); });
  $id('sform').addEventListener('submit', suche);
  $id('korbBtn').addEventListener('click', zeigeKorb);
  $id('oelBtn').addEventListener('click', zeigeOele);
  $id('uniBtn').addEventListener('click', () => zeigeUniversal());
  $id('lform').addEventListener('submit', anmelden);
  const obenPruefen = () => $id('nachoben').classList.toggle('pk-zeig', (window.scrollY || document.documentElement.scrollTop) > 400);
  window.addEventListener('scroll', obenPruefen, { passive: true }); obenPruefen();
  $id('nachoben').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  new MutationObserver(empfSichtbar).observe($id('out'), { childList: true });
  $id('abmelden').addEventListener('click', () => abmelden());
  $id('historie').addEventListener('click', zeigeHistorie);
  $id('nutzerBtn').addEventListener('click', (e) => { e.stopPropagation(); $id('menue').hidden = !$id('menue').hidden; });
  document.addEventListener('click', (e) => { if (!e.target.closest('#pak .pk-nutzer')) $id('menue').hidden = true; });
  try { sitzung = JSON.parse(sessionStorage.getItem('pk_sitzung')); } catch (x) { sitzung = null; }
  if (sitzung && sitzung.headerauth) appStart(); else $id('lbenutzer').focus();
})();
</script>
</div>
</body>
</html>
